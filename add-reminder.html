<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إضافة تذكير — قلم</title>
<style>
  body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:#0F1D38;color:#E8C96A;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:24px;}
  .box{max-width:320px;}
  .box b{color:#fff;display:block;margin-top:8px;font-size:15px;}
</style>
</head>
<body>
  <div class="box">
    <div>📅 جارِ فتح التقويم…</div>
    <b id="msg"></b>
  </div>
<script>
function icsEsc(s){ return (s||'').toString().replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function toICSDate(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }

const p = new URLSearchParams(location.search);
const name = p.get('name') || '';
const date = p.get('date') || '';
const time = p.get('time') || '09:00';
const svc  = p.get('svc')  || '';
const note = p.get('note') || '';
const remind = p.get('remind') || '';

const msg = document.getElementById('msg');

if(!name || !date){
  msg.textContent = 'بيانات الموعد ناقصة — ارجع وحاول مرة ثانية.';
}else{
  try{
    const start = new Date(date+'T'+time+':00');
    const end = new Date(start.getTime()+30*60000);
    const desc = [svc?('نوع الخدمة: '+svc):'', note?('ملاحظات: '+note):''].filter(Boolean).join('\n');
    const lines = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kalem//Appointment//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH',
      'BEGIN:VEVENT',
      `UID:${Date.now()}@kalemofisi.com`,
      `DTSTAMP:${toICSDate(new Date())}`,
      `DTSTART:${toICSDate(start)}`,
      `DTEND:${toICSDate(end)}`,
      `SUMMARY:${icsEsc('موعد - '+name)}`,
      desc ? `DESCRIPTION:${icsEsc(desc)}` : ''
    ];
    if(remind){
      lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:تذكير موعد',`TRIGGER:-PT${parseInt(remind)}M`,'END:VALARM');
    }
    lines.push('END:VEVENT','END:VCALENDAR');
    const ics = lines.filter(Boolean).join('\r\n');
    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    window.location.href = url;
    setTimeout(()=>{ msg.textContent = 'إذا ما ظهرت شاشة الإضافة، ارجع وحاول من صفاري مباشرة.'; }, 2500);
  }catch(err){
    msg.textContent = 'حدث خطأ: ' + err.message;
  }
}
</script>
</body>
</html>
